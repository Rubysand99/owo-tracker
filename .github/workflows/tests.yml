name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Cài thư viện
        run: pip install -r requirements-dev.txt pyflakes

      - name: Kiểm tra lỗi cú pháp / tên chưa định nghĩa
        # pyflakes báo cả "import không dùng" (owo_parsers được import lại cho test) nên chỉ chặn lỗi thật
        run: |
          python -m py_compile owo_tracker_bot.py owo_parsers.py auto_refresh.py weapon_cleanup.py
          python -m pyflakes owo_tracker_bot.py owo_parsers.py auto_refresh.py weapon_cleanup.py | grep -v "imported but unused" || true
          if python -m pyflakes owo_tracker_bot.py owo_parsers.py auto_refresh.py weapon_cleanup.py | grep -E "undefined name|redefinition"; then exit 1; fi

      - name: Chạy toàn bộ test
        run: |
          fail=0
          for t in test_*.py; do
            echo "::group::$t"
            python "$t" || fail=1
            echo "::endgroup::"
          done
          exit $fail
